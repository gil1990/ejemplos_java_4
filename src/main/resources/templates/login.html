<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
</head>
<body>
    <h1>Iniciar Sesion</h1>
    <form th:action="@{login}" method="post">
        <label>Usuario: <input type="text" name="username"/></label><br/>
        <label>Contraseña: <input type="text" name="password"/></label><br/>
        <button type="submit">Ingresar</button>
    </form>

    <p th:if="${param.error}">Usuario o contraseña incorrectos</p>
    <p th:if="${param.logout}">Sesion cerrada con exito!</p>

</body>
</html>
